}
const allDays=Object.values(DATA.months).flat();
const today=new Date();
let selectedWeek=defaultWeek(allDays,today),showRooms=true;
let selectedMonth='week';
const todayKey=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
const isToday=date=>date===todayKey&&allDays.some(day=>day.date===date);
function evHtml(ev){return '<div class="ev"><span class="n">'+ev.p+'</span><span class="s"><div class="subject">'+SHORT[ev.s]+'</div>'+(DATA.subjects[ev.s][2]?'<div class="teacher">'+DATA.subjects[ev.s][2]+'</div>':'')+(showRooms?'<div class="room">'+ev.r+'</div>':'')+'</span><span class="type '+(ev.t==='ПЗ'?'pz':'')+'">'+ev.t+'</span></div>'}
function monthBlock(m){
 const days=DATA.months[String(m)],weeks=[...new Set(days.map(v=>v.week))];
 let list=['<div class="weekhead">Нед.</div>'].concat(['Пн','Вт','Ср','Чт','Пт','Сб'].map(x=>'<div class="weekday">'+x+'</div>'));
 for(let w of weeks){
  list.push('<div class="weekbadge '+(selectedWeek===w?'active':'')+'" role="button" tabindex="0" data-week="'+w+'" aria-label="Показать '+weekName(w)+'"><strong>'+w+' нед.</strong><span>'+(w%2?'нечёт.':'чёт.')+'</span></div>');
  for(let dow=0;dow<6;dow++){
   let day=getDay(m,w,dow);
   if(!day){list.push('<div class="day blank"></div>');continue}
   let body=day.holiday?'<div class="hl">'+day.holiday+'</div>':(day.events.length?'<div class="events">'+day.events.map(evHtml).join('')+'</div>':'<div class="none">Пар нет</div>');
   list.push('<div class="day '+(day.holiday?'holiday ':'')+(selectedWeek===w?'selected ':'')+(isToday(day.date)?'today':'')+'" '+(isToday(day.date)?'aria-current="date" ':'')+'data-week="'+w+'" data-date="'+day.date+'" role="button" tabindex="0" aria-label="'+day.day+' '+MS[m]+': '+day.events.length+' пар"><div class="daytop"><span class="daynum">'+day.day+'</span>'+(isToday(day.date)?'<span class="today-pill">Сегодня</span>':'')+'</div>'+body+'</div>');
  }
 }
 return list.join('');
}
function bindWeeks(){
 document.querySelectorAll('[data-week]').forEach(el=>{
  let go=()=>{selectedWeek=+el.dataset.week;selectedMonth='week';render();document.querySelector('.tab[data-month="week"]').focus()};
  el.addEventListener('click',go);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
 });
}
function render(){
 document.querySelectorAll('.tab').forEach(b=>{let active=String(selectedMonth)===b.dataset.month;b.classList.toggle('sel',active);b.setAttribute('aria-pressed',active?'true':'false')});
 const weekView=selectedMonth==='week';
 document.querySelector('.layout').classList.toggle('week-view',weekView);
 $('calendarPane').hidden=weekView;
 $('detail').hidden=!weekView;
 if(weekView){renderDetail();return}
 let all=selectedMonth==='all';
 $('monthTitle').textContent=all?'Ноябрь — декабрь 2026':MS[selectedMonth]+' 2026';
 if(all){
  $('calGrid').classList.remove('cal-grid');
  $('calGrid').innerHTML=[11,12].map(m=>'<section class="month-section"><h3 class="month-title">'+MS[m]+' 2026</h3><div class="month-grid">'+monthBlock(m)+'</div></section>').join('');
 }else{
  $('calGrid').classList.add('cal-grid');
  $('calGrid').innerHTML=monthBlock(selectedMonth);
 }
 let days=all?Object.values(DATA.months).flat():DATA.months[String(selectedMonth)];
 let weeks=[...new Set(days.map(v=>v.week))];
 $('monthMini').textContent=all?'2 месяца · недели 10–17 · '+days.reduce((n,x)=>n+x.events.length,0)+' пар по расписанию':weeks.length+' учебных строк · '+days.reduce((n,x)=>n+x.events.length,0)+' пар по расписанию';
 bindWeeks();
 renderDetail();
}
function renderDetail(){
 $('detailHeading').textContent=weekName(selectedWeek)+(selectedWeek===17?' · пар нет':'');
 $('detailPeriod').textContent=weekdates(selectedWeek);
 let header='<thead><tr><th class="timecell">Время</th>';
 for(let dow=0;dow<6;dow++){let d=mondayOf(selectedWeek);d.setUTCDate(d.getUTCDate()+dow);const ds=d.toISOString().slice(0,10);header+='<th'+(isToday(ds)?' class="today-column" aria-current="date"':'')+'>'+['Пн','Вт','Ср','Чт','Пт','Сб'][dow]+' · '+fmtDay(d)+(isToday(ds)?'<span class="today-pill">Сегодня</span>':'')+'</th>'}
 header+='</tr></thead>';
 let body='<tbody>';
 for(let p=1;p<=5;p++){
  body+='<tr><td class="timecell"><b>'+p+'</b> '+periods[p-1]+'</td>';
  for(let dow=0;dow<6;dow++){
   let d=mondayOf(selectedWeek);d.setUTCDate(d.getUTCDate()+dow);
   let ds=d.toISOString().slice(0,10),m=d.getUTCMonth()+1;
   let day=(DATA.months[String(m)]||[]).find(x=>x.date===ds);
   const todayClass=isToday(ds)?' today-column':'';
   if(!day||selectedWeek>17){body+='<td class="cell"><span class="details-empty">—</span></td>';continue}
   if(day.holiday){body+='<td class="cell day-holiday'+todayClass+'">'+(p===1?'Неучебный день':'—')+'</td>';continue}
   let ev=day.events.find(e=>e.p===p);
   if(ev)body+='<td class="cell'+todayClass+'"><div class="e2 '+(ev.t==='ПЗ'?'practice':'lecture')+(DATA.subjects[ev.s][2]?'':' no-teacher')+'"><div class="label">'+SHORT[ev.s]+'</div>'+(DATA.subjects[ev.s][2]?'<div class="teacher">'+DATA.subjects[ev.s][2]+'</div>':'')+(showRooms?'<div class="room">'+ev.r+'</div>':'')+'<span class="type '+(ev.t==='ПЗ'?'pz':'')+'">'+ev.t+'</span></div></td>';
   else body+='<td class="cell'+todayClass+'"><span class="details-empty">'+(selectedWeek===17&&dow===2&&p===1?'Пар нет':'—')+'</span></td>';
  }
  body+='</tr>';
 }
 $('timetable').innerHTML=header+body+'</tbody>';
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
 selectedMonth=['week','all'].includes(b.dataset.month)?b.dataset.month:+b.dataset.month;
 selectedWeek=defaultWeek(typeof selectedMonth==='string'?allDays:DATA.months[String(selectedMonth)]);
 render();
}));
$('legendGrid').innerHTML=Object.entries(DATA.subjects).map(([code,entry])=>'<div class="legend-item"><strong>'+entry[0]+'</strong> — '+entry[1]+(entry[2]?' · '+entry[2]:'')+'</div>').join('');
$('railSlots').innerHTML=periods.map((t,i)=>'<div class="slot"><span class="slotnum">'+(i+1)+'</span><span class="slottime">'+t+'</span></div>').join('');
document.getElementById('roomToggle').addEventListener('change',e=>{showRooms=e.target.checked;render()});
render();

</script></body></html>
